<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="goldGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="32" cy="32" r="30" fill="#0E1326"/>
  <circle cx="32" cy="32" r="28" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.85"/>
  <circle cx="32" cy="32" r="22" fill="url(#blueGlow)"/>

  <!-- Golden Doraemon Bell / Gift Ornament -->
  <!-- Bell Body -->
  <circle cx="32" cy="34" r="14" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Bell Horizontal Belt Stripe -->
  <rect x="18.5" y="31" width="27" height="3" rx="1.5" fill="#5A400B"/>

  <!-- Bell Center Keyhole -->
  <circle cx="32" cy="38" r="3.2" fill="#3B2605"/>
  <rect x="31" y="38" width="2" height="6.5" rx="1" fill="#3B2605"/>

  <!-- Top Ribbon Loop / Ring -->
  <circle cx="32" cy="18" r="4.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Magical Sparkles -->
  <!-- Top Left Sparkle -->
  <path d="M14 18 C14 20, 16 20, 16 20 C16 20, 14 20, 14 22 C14 20, 12 20, 12 20 C12 20, 14 20, 14 18 Z" fill="#FFE082"/>
  <!-- Top Right Sparkle -->
  <path d="M50 16 C50 19, 53 19, 53 19 C53 19, 50 19, 50 22 C50 19, 47 19, 47 19 C47 19, 50 19, 50 16 Z" fill="#FFF275"/>
  <!-- Bottom Star -->
  <circle cx="48" cy="46" r="1.5" fill="#FFEAA7"/>
</svg>